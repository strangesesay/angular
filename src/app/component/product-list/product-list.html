<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-lg border-0 rounded-3 h-100">
        <div class="card-body text-center">
          <img [src]="products.mimage" class="img-fluid rounded-3" alt="Product Banner" />
          <h5 class="card-title fw-bold">{{ products.name }}</h5>
          <p class="card-text text-muted fs-5">$ {{ products.price }}</p>
        </div>

        <div class="card-footer bg-transparent border-0">
          <!-- Angular 20 event binding -->
          <button class="btn btn-primary w-100" [disabled]="!(products.instock > 0)" >
            <i class="bi bi-cart-fill"></i> Buy Now
          </button>
          <input [value]="name">
        </div>
      </div>
    </div>
  </div>
</div>
