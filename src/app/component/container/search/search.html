<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <!-- Search input group -->
      <div class="input-group mb-3">
        <input
          type="text"
          class="form-control"
          placeholder="Enter search term..." [value]="searchText" [(ngModel)]="searchText">
        <button class="btn btn-primary" type="button" [disabled]="!searchText" >
          <i class="bi bi-search"></i> Search
        </button>
      </div>

      <!-- Display search result -->
      <p class="fw-bold text-success text-center" *ngIf="searchText !==''">
        <strong>Search result for: </strong> {{searchText}}
      </p>

    </div>
  </div>
</div>
